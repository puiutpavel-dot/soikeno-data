name: collect-keno

on:
  schedule:
    # Keno draws 06:00–22:00 Vietnam time (UTC+7) = 23:00–15:00 UTC
    - cron: "*/10 23 * * *"
    - cron: "*/10 0-15 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep polling"
        default: "25"

concurrency:
  group: collect-keno
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Configure git
        run: |
          git config user.name "soikeno-bot"
          git config user.email "soikeno-bot@users.noreply.github.com"
      - name: Collect
        run: python3 scripts/collect.py loop "${{ github.event.inputs.minutes || '25' }}"
